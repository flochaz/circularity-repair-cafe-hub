# Deploy the hub to Cloudflare Workers on every push to main.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   a token with:
#                            Account -> Workers Scripts: Edit
#                            Account -> D1: Edit
#                            Account -> Workers R2 Storage: Edit
#                            Account -> Account Settings: Read
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
#
# The first deploy provisions the D1 database and R2 bucket named in
# apps/cloudflare/wrangler.jsonc; later deploys reuse them.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm cf:test
      - name: Deploy to Cloudflare Workers
        run: pnpm cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
